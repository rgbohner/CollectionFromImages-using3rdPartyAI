name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify development setup
        if: runner.os != 'Windows'
        run: |
          ./setup.sh --skip-tests
          printf '\n# setup-preservation-check\n' >> .env
          ./setup.sh --skip-tests
          grep -q setup-preservation-check .env
          npm run dev -- build ./examples --offline -o ./output/setup-demo
      - run: npm pack --dry-run
